model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[mcp_servers.dbt]
url = "https://lz192.us1.dbt.com/api/ai/v1/mcp/"

[mcp_servers.terraform]
command = "container"
args = [
    "run",
    "-i",
    "--rm",
    "hashicorp/terraform-mcp-server",
]

[mcp_servers.github]
command = "container"
args = [
    "run",
    "-i",
    "--rm",
    "-e",
    "GITHUB_PERSONAL_ACCESS_TOKEN",
    "-e",
    "GITHUB_TOOLSETS",
    "ghcr.io/github/github-mcp-server"
]
env_vars = [
    "GITHUB_PERSONAL_ACCESS_TOKEN",
    "GITHUB_TOOLSETS"
]
[mcp_servers.github.env]
GITHUB_TOOLSETS = "context,actions,code_quality,issues,labels,pull_requests,repos"

[shell_environment_policy]
inherit = "core"

[tui]
vim_mode_default = true

[tui.model_availability_nux]
"gpt-5.6-sol" = 4
