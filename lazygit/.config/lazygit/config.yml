gui:
  border: rounded
  showBottomLine: false
  theme:
    activeBorderColor:
      - "#89b4fa"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    cherryPickedCommitBgColor:
      - "#45475a"
    cherryPickedCommitFgColor:
      - "#89b4fa"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    searchingActiveBorderColor:
      - "#f9e2af"
keybinding:
  universal:
    undo: "u"
    redo: "U"
  status:
    checkForUpdate: "G"
git:
  overrideGpg: true
# hunk is a full-screen TUI, so it cannot render in the diff panel. <c-t>
# (the "open external diff tool" key) opens the selection in hunk instead
customCommands:
  - key: <c-t>
    context: files
    command: hunk diff
    description: Review working tree in hunk
    output: terminal
  - key: <c-t>
    context: commits, subCommits, reflogCommits
    command: hunk show {{.SelectedCommit.Hash}}
    description: Review commit in hunk
    output: terminal
  - key: <c-t>
    context: commitFiles
    command: hunk show {{.SelectedCommit.Hash}} -- {{.SelectedCommitFile.Name | quote}}
    description: Review file in hunk
    output: terminal
  - key: <c-t>
    context: stash
    command: hunk stash show {{.SelectedStashEntry.RefName}}
    description: Review stash in hunk
    output: terminal
  - key: <c-t>
    context: localBranches, remoteBranches
    command: hunk diff {{.SelectedRef.RefName | quote}}...HEAD
    description: Review branch diff in hunk
    output: terminal
quitOnTopLevelReturn: true
